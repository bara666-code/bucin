<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Ours — 3D Memory Space</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'Inter', system-ui, sans-serif;
      color: #e8e0e8;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ========== UI OVERLAY ========== */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.1rem, 3.5vw, 1.35rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #f5e6f0;
      text-shadow: 0 0 24px rgba(255, 180, 210, 0.35);
    }

    .brand span {
      font-weight: 400;
      opacity: 0.65;
      font-size: 0.85em;
    }

    .status {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.55;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    .status-dot.active {
      background: #a8e6cf;
      box-shadow: 0 0 10px #a8e6cf;
    }

    .hint {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom) + 12px);
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: clamp(0.7rem, 2.2vw, 0.8rem);
      opacity: 0.5;
      letter-spacing: 0.03em;
      max-width: min(92%, 420px);
      line-height: 1.55;
      transition: opacity 0.7s;
      padding: 0 12px;
    }

    .hint.hidden { opacity: 0; pointer-events: none; }

    /* ========== START SCREEN ========== */
    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: radial-gradient(ellipse at 50% 38%, #1a1220 0%, #0a0a0f 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding: 24px;
      transition: opacity 0.85s ease, visibility 0.85s;
    }

    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 600;
      color: #f8eef5;
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.2;
    }

    .start-sub {
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      opacity: 0.6;
      max-width: 360px;
      text-align: center;
      line-height: 1.65;
      font-weight: 300;
    }

    #start-btn {
      pointer-events: auto;
      margin-top: 10px;
      padding: 14px 40px;
      border: 1px solid rgba(255, 200, 220, 0.35);
      background: rgba(255, 180, 200, 0.08);
      color: #f5e6f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    #start-btn:hover, #start-btn:active {
      background: rgba(255, 180, 200, 0.18);
      border-color: rgba(255, 200, 220, 0.55);
      box-shadow: 0 0 32px rgba(255, 160, 190, 0.22);
    }

    /* ========== WEBCAM PREVIEW ========== */
    #webcam-wrap {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom) + 8px);
      right: max(16px, env(safe-area-inset-right) + 8px);
      width: clamp(100px, 22vw, 140px);
      height: clamp(75px, 16.5vw, 105px);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 200, 220, 0.2);
      z-index: 15;
      opacity: 0;
      transition: opacity 0.5s;
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
      background: #111;
    }

    #webcam-wrap.visible { opacity: 0.82; }

    #webcam-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    /* ========== GESTURE LABEL ========== */
    #gesture-label {
      position: fixed;
      top: max(72px, env(safe-area-inset-top) + 52px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 12;
      color: #d4a5c0;
      pointer-events: none;
      white-space: nowrap;
    }

    #gesture-label.show { opacity: 0.75; }

    /* ========== CONTROL BUTTONS ========== */
    .ctrl-btn {
      pointer-events: auto;
      padding: 8px 14px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,200,220,0.22);
      color: #e8d0e0;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.4s, background 0.2s, border-color 0.2s;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      white-space: nowrap;
    }

    .ctrl-btn.visible { opacity: 0.85; }
    .ctrl-btn:hover, .ctrl-btn:active {
      background: rgba(255,180,200,0.14);
      border-color: rgba(255,200,220,0.4);
    }

    #upload-btn { position: fixed; top: max(24px, env(safe-area-inset-top) + 8px); right: max(16px, env(safe-area-inset-right) + 8px); z-index: 16; }
    #music-btn { position: fixed; top: max(24px, env(safe-area-inset-top) + 8px); right: max(90px, env(safe-area-inset-right) + 82px); z-index: 16; }
    #msg-btn { position: fixed; top: max(24px, env(safe-area-inset-top) + 8px); right: max(164px, env(safe-area-inset-right) + 156px); z-index: 16; }

    @media (max-width: 520px) {
      #msg-btn { display: none; }
      #music-btn { right: max(90px, env(safe-area-inset-right) + 82px); }
    }

    #file-input { display: none; }

    /* ========== MESSAGE PANEL ========== */
    #msg-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      width: min(92vw, 380px);
      background: rgba(18, 12, 22, 0.92);
      border: 1px solid rgba(255, 200, 220, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
      z-index: 25;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, transform 0.35s, visibility 0.35s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #msg-panel.open {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    #msg-panel h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 500;
      margin-bottom: 14px;
      color: #f5e6f0;
      text-align: center;
    }

    #msg-panel textarea {
      width: 100%;
      height: 110px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,200,220,0.18);
      border-radius: 10px;
      color: #e8dce8;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      padding: 12px 14px;
      resize: none;
      outline: none;
      line-height: 1.5;
    }

    #msg-panel textarea:focus {
      border-color: rgba(255,200,220,0.4);
    }

    .msg-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      justify-content: flex-end;
    }

    .msg-actions button {
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }

    #msg-cancel {
      background: transparent;
      color: #aaa;
      border: 1px solid rgba(255,255,255,0.12);
    }

    #msg-save {
      background: rgba(255, 180, 200, 0.2);
      color: #f5e6f0;
      border: 1px solid rgba(255,200,220,0.3);
    }

    #msg-save:hover { background: rgba(255, 180, 200, 0.32); }

    /* ========== FLOATING MESSAGE (3D TEXT OVERLAY) ========== */
    #floating-msg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9;
      pointer-events: none;
      text-align: center;
      max-width: min(88vw, 480px);
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    #floating-msg.visible { opacity: 1; }

    #floating-msg .msg-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.15rem, 4.2vw, 1.7rem);
      font-weight: 400;
      color: rgba(255, 230, 240, 0.88);
      line-height: 1.55;
      text-shadow: 0 0 40px rgba(255, 160, 190, 0.35), 0 2px 12px rgba(0,0,0,0.5);
      letter-spacing: 0.02em;
    }

    #floating-msg .msg-from {
      margin-top: 14px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    /* ========== LOADING ========== */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #0a0a0f;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      transition: opacity 0.6s;
    }

    #loading.hidden { opacity: 0; pointer-events: none; }

    .loader {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(255,200,220,0.18);
      border-top-color: #e8b0c8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      opacity: 0.5;
    }

    /* ========== HEART BURST ========== */
    .heart-burst {
      position: fixed;
      pointer-events: none;
      z-index: 18;
      font-size: 18px;
      animation: heartFly 1.4s ease-out forwards;
      color: #f0a0c0;
      text-shadow: 0 0 12px rgba(255,160,190,0.6);
    }

    @keyframes heartFly {
      0% { opacity: 1; transform: translate(0,0) scale(0.6); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.3); }
    }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .top-bar { gap: 8px; }
      .status { font-size: 0.62rem; }
      #webcam-wrap {
        width: 96px;
        height: 72px;
        bottom: max(16px, env(safe-area-inset-bottom) + 6px);
        right: max(12px, env(safe-area-inset-right) + 6px);
      }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader"></div>
    <div class="loading-text">Menyiapkan ruang...</div>
  </div>

  <div id="start-screen">
    <div class="start-title">Ours</div>
    <div class="start-sub">Ruang memori 3D yang bisa kamu gerakkan dengan tangan. Geser, sentuh, dan rasakan kenangan bersama.</div>
    <button id="start-btn">Buka Kamera</button>
  </div>

  <div id="ui">
    <div class="top-bar">
      <div class="brand">Ours <span>· memory space</span></div>
      <div class="status">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text">Kamera off</span>
      </div>
    </div>
    <div class="hint" id="hint">
      Telapak terbuka · geser ruang &nbsp;·&nbsp; Cubit · ambil foto &nbsp;·&nbsp; Kepalkan · heart burst
    </div>
  </div>

  <div id="gesture-label">—</div>

  <button class="ctrl-btn" id="msg-btn">Pesan</button>
  <button class="ctrl-btn" id="music-btn">Musik</button>
  <button class="ctrl-btn" id="upload-btn">+ Foto</button>
  <input type="file" id="file-input" accept="image/*" multiple />

  <div id="floating-msg">
    <div class="msg-text" id="msg-text-content">Untukmu yang selalu ada</div>
    <div class="msg-from">— ours</div>
  </div>

  <div id="msg-panel">
    <h3>Pesan Cinta</h3>
    <textarea id="msg-input" placeholder="Tulis pesan yang ingin ditampilkan di tengah ruang..." maxlength="180">Untukmu yang selalu ada</textarea>
    <div class="msg-actions">
      <button id="msg-cancel">Batal</button>
      <button id="msg-save">Simpan</button>
    </div>
  </div>

  <div id="webcam-wrap">
    <video id="webcam" playsinline autoplay muted></video>
  </div>

  <div id="canvas-container"></div>

  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <script>
    // ===================== CONFIG =====================
    const CONFIG = {
      maxPhotos: 10,
      photoSize: 1.55,
      handSmooth: 0.2,
      panSensitivity: 4.5,
      scrollSensitivity: 0.04,
      pinchThreshold: 0.055,
      fistThreshold: 0.07,
      openPalmThreshold: 0.09
    };

    // ===================== STATE =====================
    let scene, camera, renderer, clock;
    let photos = [];
    let particles, heartParticles;
    let handLandmarks = null;
    let prevHandX = 0.5, prevHandY = 0.5;
    let targetCamX = 0, targetCamY = 0;
    let isPinching = false;
    let isFist = false;
    let wasFist = false;
    let grabbedPhoto = null;
    let grabOffset = new THREE.Vector3();
    let handWorldPos = new THREE.Vector3();
    let isOpenPalm = false;
    let scrollVel = { x: 0, y: 0 };
    let cameraStarted = false;
    let musicPlaying = false;
    let audioCtx = null;
    let musicNodes = [];
    let lastHeartBurst = 0;
    let floatingMsgVisible = true;

    // ===================== INIT THREE =====================
    function initThree() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0a0f, 0.042);

      camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 80);
      camera.position.set(0, 0, 6.8);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x0a0a0f, 1);
      container.appendChild(renderer.domElement);

      // Lights
      scene.add(new THREE.AmbientLight(0xffe0f0, 0.5));

      const p1 = new THREE.PointLight(0xffb0d0, 0.65, 28);
      p1.position.set(2.2, 2.8, 4);
      scene.add(p1);

      const p2 = new THREE.PointLight(0xb0a0ff, 0.3, 22);
      p2.position.set(-3, -1.2, 2.5);
      scene.add(p2);

      const p3 = new THREE.PointLight(0xffd0e0, 0.25, 18);
      p3.position.set(0, -2, 3);
      scene.add(p3);

      createParticles();
      createHeartParticles();
      createDefaultPhotos();

      // Soft floor
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(50, 50),
        new THREE.MeshBasicMaterial({ color: 0x07070b, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.y = -3;
      scene.add(plane);

      clock = new THREE.Clock();
      window.addEventListener('resize', onResize);
      window.addEventListener('orientationchange', () => setTimeout(onResize, 200));
      animate();
    }

    function createParticles() {
      const count = window.innerWidth < 600 ? 110 : 200;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        pos[i*3]     = (Math.random()-0.5) * 24;
        pos[i*3+1]   = (Math.random()-0.5) * 15;
        pos[i*3+2]   = (Math.random()-0.5) * 20 - 1;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      particles = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffd0e8, size: 0.032, transparent: true, opacity: 0.4,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      }));
      scene.add(particles);
    }

    function createHeartParticles() {
      const count = 40;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const vel = [];
      for (let i = 0; i < count; i++) {
        pos[i*3] = 0; pos[i*3+1] = -10; pos[i*3+2] = 0;
        vel.push({ x: 0, y: 0, z: 0, life: 0 });
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      heartParticles = new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xff90b8, size: 0.08, transparent: true, opacity: 0.7,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      }));
      heartParticles.userData.vel = vel;
      scene.add(heartParticles);
    }

    function triggerHeartBurst(origin) {
      const now = performance.now();
      if (now - lastHeartBurst < 700) return;
      lastHeartBurst = now;

      const vel = heartParticles.userData.vel;
      const pos = heartParticles.geometry.attributes.position.array;
      for (let i = 0; i < vel.length; i++) {
        pos[i*3]   = origin.x + (Math.random()-0.5)*0.3;
        pos[i*3+1] = origin.y + (Math.random()-0.5)*0.3;
        pos[i*3+2] = origin.z + (Math.random()-0.5)*0.3;
        const a = Math.random() * Math.PI * 2;
        const s = 0.04 + Math.random() * 0.08;
        vel[i].x = Math.cos(a) * s;
        vel[i].y = 0.06 + Math.random() * 0.1;
        vel[i].z = Math.sin(a) * s * 0.6;
        vel[i].life = 1.2 + Math.random() * 0.8;
      }
      heartParticles.geometry.attributes.position.needsUpdate = true;

      // DOM hearts too
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'heart-burst';
        el.textContent = '♡';
        el.style.left = (50 + (Math.random()-0.5)*20) + '%';
        el.style.top  = (45 + (Math.random()-0.5)*15) + '%';
        el.style.setProperty('--tx', ((Math.random()-0.5)*120) + 'px');
        el.style.setProperty('--ty', (-80 - Math.random()*100) + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }
    }

    // Canvas photo textures
    const photoColors = [
      [0x2a1a28, 0x4a3048], [0x1e1a2e, 0x3a3050], [0x221820, 0x3e2a38],
      [0x1a1e28, 0x2e3848], [0x281a22, 0x483040], [0x1c1a26, 0x342e44]
    ];

    function createCanvasTexture(index, label) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 640;
      const ctx = canvas.getContext('2d');
      const [c1, c2] = photoColors[index % photoColors.length];
      const g = ctx.createLinearGradient(0, 0, 0, 640);
      g.addColorStop(0, '#' + c1.toString(16).padStart(6,'0'));
      g.addColorStop(1, '#' + c2.toString(16).padStart(6,'0'));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 512, 640);

      const vg = ctx.createRadialGradient(256, 320, 60, 256, 320, 400);
      vg.addColorStop(0, 'rgba(0,0,0,0)');
      vg.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, 512, 640);

      ctx.fillStyle = 'rgba(255,230,240,0.5)';
      ctx.font = '300 20px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(label || 'memory', 256, 300);
      ctx.fillStyle = 'rgba(255,220,235,0.22)';
      ctx.font = '400 13px Inter, sans-serif';
      ctx.fillText(String(index + 1), 256, 340);

      const tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }

    function createPhotoTexture(index, customUrl) {
      return new Promise((resolve) => {
        if (customUrl) {
          const loader = new THREE.TextureLoader();
          loader.crossOrigin = 'anonymous';
          loader.load(customUrl, (tex) => {
            tex.minFilter = THREE.LinearFilter;
            resolve(tex);
          }, undefined, () => resolve(createCanvasTexture(index)));
        } else {
          resolve(createCanvasTexture(index));
        }
      });
    }

    async function createDefaultPhotos() {
      const positions = [
        { x: -3.3, y: 0.9,  z: -1.0, ry: 0.28 },
        { x: -1.2, y: -0.7, z:  0.5, ry: -0.12 },
        { x:  1.5, y: 1.0,  z: -0.7, ry: -0.22 },
        { x:  3.1, y: -0.5, z:  0.3, ry: 0.18 },
        { x: -2.1, y: 1.7,  z:  1.6, ry: 0.38 },
        { x:  0.4, y: -1.5, z: -1.9, ry: 0.06 },
        { x:  2.5, y: 1.4,  z:  1.2, ry: -0.32 },
        { x: -0.7, y: 0.3,  z:  2.3, ry: 0.12 }
      ];
      for (let i = 0; i < positions.length; i++) {
        const tex = await createPhotoTexture(i);
        addPhoto(tex, positions[i]);
      }
    }

    function addPhoto(texture, pos) {
      const w = CONFIG.photoSize;
      const h = CONFIG.photoSize / 0.8;
      const group = new THREE.Group();

      const mesh = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshStandardMaterial({ map: texture, roughness: 0.75, metalness: 0.04, side: THREE.DoubleSide })
      );
      group.add(mesh);

      const frame = new THREE.Mesh(
        new THREE.PlaneGeometry(w + 0.09, h + 0.09),
        new THREE.MeshBasicMaterial({ color: 0x161018, side: THREE.DoubleSide })
      );
      frame.position.z = -0.012;
      group.add(frame);

      const border = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(w + 0.07, h + 0.07)),
        new THREE.LineBasicMaterial({ color: 0xd0a0b8, transparent: true, opacity: 0.32 })
      );
      border.position.z = 0.006;
      group.add(border);

      group.position.set(pos.x, pos.y, pos.z);
      group.rotation.y = pos.ry || 0;
      group.userData = {
        isPhoto: true,
        baseY: pos.y,
        floatPhase: Math.random() * Math.PI * 2,
        originalPos: group.position.clone()
      };

      scene.add(group);
      photos.push(group);
      return group;
    }

    // ===================== HAND TRACKING =====================
    async function startCamera() {
      const video = document.getElementById('webcam');
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.62,
        minTrackingConfidence: 0.52
      });

      hands.onResults(onHandResults);

      const cam = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640,
        height: 480
      });

      await cam.start();
      cameraStarted = true;

      document.getElementById('webcam-wrap').classList.add('visible');
      document.getElementById('status-dot').classList.add('active');
      document.getElementById('status-text').textContent = 'Tangan terdeteksi';
      document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.add('visible'));
      document.getElementById('floating-msg').classList.add('visible');

      setTimeout(() => document.getElementById('hint').classList.add('hidden'), 10000);
    }

    function onHandResults(results) {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        handLandmarks = results.multiHandLandmarks[0];
        document.getElementById('status-text').textContent = 'Tangan aktif';
        processGestures(handLandmarks);
      } else {
        handLandmarks = null;
        isPinching = false;
        isFist = false;
        if (grabbedPhoto) grabbedPhoto = null;
        document.getElementById('status-text').textContent = 'Mencari tangan...';
        document.getElementById('gesture-label').classList.remove('show');
      }
    }

    function processGestures(landmarks) {
      const wrist = landmarks[0];
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const middleTip = landmarks[12];
      const ringTip = landmarks[16];
      const pinkyTip = landmarks[20];
      const indexMcp = landmarks[5];
      const middleMcp = landmarks[9];
      const ringMcp = landmarks[13];
      const pinkyMcp = landmarks[17];

      const palmX = (wrist.x + indexMcp.x + middleMcp.x) / 3;
      const palmY = (wrist.y + indexMcp.y + middleMcp.y) / 3;
      const handX = 1 - palmX;
      const handY = palmY;

      prevHandX += (handX - prevHandX) * CONFIG.handSmooth;
      prevHandY += (handY - prevHandY) * CONFIG.handSmooth;

      handWorldPos.set(
        (prevHandX - 0.5) * 8.5,
        -(prevHandY - 0.5) * 5.8,
        1.6
      );

      // Pinch
      const dx = thumbTip.x - indexTip.x;
      const dy = thumbTip.y - indexTip.y;
      const pinchDist = Math.sqrt(dx*dx + dy*dy);
      const wasPinching = isPinching;
      isPinching = pinchDist < CONFIG.pinchThreshold;

      // Open palm (fingers extended)
      const tipY = (indexTip.y + middleTip.y + ringTip.y + pinkyTip.y) / 4;
      const mcpY = (indexMcp.y + middleMcp.y + ringMcp.y + pinkyMcp.y) / 4;
      isOpenPalm = (mcpY - tipY) > CONFIG.openPalmThreshold && pinchDist > 0.1;

      // Fist (all fingertips close to MCPs)
      const fistDists = [
        Math.hypot(indexTip.x - indexMcp.x, indexTip.y - indexMcp.y),
        Math.hypot(middleTip.x - middleMcp.x, middleTip.y - middleMcp.y),
        Math.hypot(ringTip.x - ringMcp.x, ringTip.y - ringMcp.y),
        Math.hypot(pinkyTip.x - pinkyMcp.x, pinkyTip.y - pinkyMcp.y)
      ];
      const avgFist = fistDists.reduce((a,b) => a+b, 0) / 4;
      wasFist = isFist;
      isFist = avgFist < CONFIG.fistThreshold && pinchDist < 0.12;

      // Label
      const label = document.getElementById('gesture-label');
      if (isPinching) {
        label.textContent = 'Cubit · ambil foto';
        label.classList.add('show');
      } else if (isFist) {
        label.textContent = 'Kepalan · heart burst';
        label.classList.add('show');
      } else if (isOpenPalm) {
        label.textContent = 'Telapak · geser ruang';
        label.classList.add('show');
      } else {
        label.classList.remove('show');
      }

      // Grab
      if (isPinching && !wasPinching) {
        let nearest = null, minD = 1.9;
        photos.forEach(p => {
          const d = p.position.distanceTo(handWorldPos);
          if (d < minD) { minD = d; nearest = p; }
        });
        if (nearest) {
          grabbedPhoto = nearest;
          grabOffset.copy(nearest.position).sub(handWorldPos);
        }
      }
      if (!isPinching && wasPinching) grabbedPhoto = null;

      if (grabbedPhoto && isPinching) {
        grabbedPhoto.position.x = handWorldPos.x + grabOffset.x;
        grabbedPhoto.position.y = handWorldPos.y + grabOffset.y;
        grabbedPhoto.position.z = handWorldPos.z * 0.35 + grabOffset.z * 0.25;
      }

      // Fist → heart burst
      if (isFist && !wasFist) {
        triggerHeartBurst(handWorldPos.clone());
      }

      // Open palm pan/scroll
      if (isOpenPalm && !isPinching) {
        const deltaX = prevHandX - 0.5;
        const deltaY = prevHandY - 0.5;
        targetCamX = -deltaX * CONFIG.panSensitivity;
        targetCamY =  deltaY * CONFIG.panSensitivity * 0.72;
        scrollVel.x += deltaX * CONFIG.scrollSensitivity;
        scrollVel.y += deltaY * CONFIG.scrollSensitivity;
      } else {
        scrollVel.x *= 0.91;
        scrollVel.y *= 0.91;
      }

      targetCamX += scrollVel.x;
      targetCamY -= scrollVel.y;
      targetCamX = Math.max(-5.8, Math.min(5.8, targetCamX));
      targetCamY = Math.max(-3.4, Math.min(3.4, targetCamY));
    }

    // ===================== SOFT MUSIC (Web Audio) =====================
    function initMusic() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      // Soft ambient pad using oscillators
      const notes = [130.81, 164.81, 196.00, 246.94]; // C3 E3 G3 B3
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = freq;

        filter.type = 'lowpass';
        filter.frequency.value = 600;
        filter.Q.value = 0.7;

        gain.gain.value = 0;

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        musicNodes.push({ osc, gain, baseFreq: freq });
      });
    }

    function toggleMusic(forcePlay) {
      initMusic();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (typeof forcePlay === 'boolean') {
        musicPlaying = forcePlay;
      } else {
        musicPlaying = !musicPlaying;
      }

      const btn = document.getElementById('music-btn');
      btn.textContent = musicPlaying ? 'Musik ✓' : 'Musik';

      musicNodes.forEach((n, i) => {
        const target = musicPlaying ? (0.035 + i * 0.008) : 0;
        n.gain.gain.cancelScheduledValues(audioCtx.currentTime);
        n.gain.gain.linearRampToValueAtTime(target, audioCtx.currentTime + 1.8);
      });

      // Gentle LFO movement when playing
      if (musicPlaying) {
        // avoid stacking multiple LFOs
        musicNodes.forEach(n => {
          if (n.lfo) { try { n.lfo.stop(); } catch(e){} n.lfo = null; }
        });
        musicNodes.forEach((n, i) => {
          const lfo = audioCtx.createOscillator();
          const lfoGain = audioCtx.createGain();
          lfo.frequency.value = 0.08 + i * 0.03;
          lfoGain.gain.value = 4 + i * 2;
          lfo.connect(lfoGain);
          lfoGain.connect(n.osc.frequency);
          lfo.start();
          n.lfo = lfo;
        });
      } else {
        musicNodes.forEach(n => {
          if (n.lfo) { try { n.lfo.stop(); } catch(e){} n.lfo = null; }
          n.osc.frequency.setValueAtTime(n.baseFreq, audioCtx.currentTime);
        });
      }
    }

    // ===================== ANIMATION =====================
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Camera
      camera.position.x += (targetCamX - camera.position.x) * 0.065;
      camera.position.y += (targetCamY - camera.position.y) * 0.065;
      camera.lookAt(camera.position.x * 0.28, camera.position.y * 0.18, 0);

      // Photos float
      photos.forEach((p) => {
        if (p !== grabbedPhoto) {
          const phase = p.userData.floatPhase;
          p.position.y = p.userData.baseY + Math.sin(t * 0.5 + phase) * 0.13;
          p.rotation.z = Math.sin(t * 0.28 + phase) * 0.028;
          p.lookAt(camera.position.x * 0.35, p.position.y, camera.position.z);
        }
      });

      // Dust particles
      if (particles) {
        particles.rotation.y = t * 0.012;
        const pos = particles.geometry.attributes.position.array;
        for (let i = 0; i < pos.length; i += 3) {
          pos[i+1] += Math.sin(t * 0.35 + i * 0.1) * 0.0007;
        }
        particles.geometry.attributes.position.needsUpdate = true;
      }

      // Heart particles physics
      if (heartParticles) {
        const pos = heartParticles.geometry.attributes.position.array;
        const vel = heartParticles.userData.vel;
        let anyAlive = false;
        for (let i = 0; i < vel.length; i++) {
          if (vel[i].life > 0) {
            anyAlive = true;
            pos[i*3]   += vel[i].x;
            pos[i*3+1] += vel[i].y;
            pos[i*3+2] += vel[i].z;
            vel[i].y -= 0.0015;
            vel[i].life -= 0.016;
          } else {
            pos[i*3+1] = -20;
          }
        }
        if (anyAlive) heartParticles.geometry.attributes.position.needsUpdate = true;
      }

      // Soft pulse on floating message opacity when music plays
      const fm = document.getElementById('floating-msg');
      if (floatingMsgVisible && musicPlaying) {
        fm.style.opacity = 0.75 + Math.sin(t * 0.6) * 0.15;
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ===================== UI EVENTS =====================
    document.getElementById('start-btn').addEventListener('click', async () => {
      document.getElementById('start-screen').classList.add('hidden');
      // Auto-play soft music on first user interaction (browser policy)
      try { toggleMusic(true); } catch (e) {}
      try {
        await startCamera();
      } catch (err) {
        console.error(err);
        document.getElementById('status-text').textContent = 'Izin kamera ditolak';
        alert('Mohon izinkan akses kamera untuk menggunakan fitur tangan.');
      }
    });

    document.getElementById('upload-btn').addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).slice(0, 4);
      for (const file of files) {
        if (photos.length >= CONFIG.maxPhotos) break;
        const url = URL.createObjectURL(file);
        const tex = await createPhotoTexture(photos.length, url);
        const angle = Math.random() * Math.PI * 2;
        const r = 1.4 + Math.random() * 2.8;
        addPhoto(tex, {
          x: Math.cos(angle) * r,
          y: (Math.random() - 0.5) * 2.6,
          z: Math.sin(angle) * r * 0.65,
          ry: (Math.random() - 0.5) * 0.55
        });
      }
      e.target.value = '';
    });

    // Message panel
    document.getElementById('msg-btn').addEventListener('click', () => {
      document.getElementById('msg-panel').classList.add('open');
      document.getElementById('msg-input').value = document.getElementById('msg-text-content').textContent;
    });

    document.getElementById('msg-cancel').addEventListener('click', () => {
      document.getElementById('msg-panel').classList.remove('open');
    });

    document.getElementById('msg-save').addEventListener('click', () => {
      const val = document.getElementById('msg-input').value.trim() || 'Untukmu yang selalu ada';
      document.getElementById('msg-text-content').textContent = val;
      document.getElementById('msg-panel').classList.remove('open');
      floatingMsgVisible = true;
      document.getElementById('floating-msg').classList.add('visible');
    });

    // Music
    document.getElementById('music-btn').addEventListener('click', toggleMusic);

    // Close panel on outside click
    document.getElementById('msg-panel').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', (e) => {
      const panel = document.getElementById('msg-panel');
      if (panel.classList.contains('open') && !panel.contains(e.target) && e.target.id !== 'msg-btn') {
        panel.classList.remove('open');
      }
    });

    // ===================== BOOT =====================
    window.addEventListener('load', () => {
      initThree();
      setTimeout(() => document.getElementById('loading').classList.add('hidden'), 500);
    });
  </script>
</body>
